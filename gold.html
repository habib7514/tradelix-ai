<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tradix Gold - AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0a0a0a; --bg-card: #141414; --gold: #F5C518; --green: #00D084; --red: #FF4757; --text-main: #ffffff; --text-muted: #999999; --border: #1F1F1F; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 20px; }
        
        /* الهيدر */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; margin-bottom: 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(245, 197, 24, 0.15); border: 1px solid rgba(245, 197, 24, 0.5); color: var(--gold); text-decoration: none; cursor: pointer; }
        .header-logo { width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--gold); object-fit: cover; }
        .header-title h1 { font-size: 18px; font-weight: 900; color: var(--gold); }
        .header-title span { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
        .bell-icon { background: var(--bg-card); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--gold); cursor: pointer; }
        
        /* المحتوى */
        .container { padding: 0 20px; max-width: 480px; margin: 0 auto; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        
        /* رسالة الترحيب */
        .welcome-card { text-align: center; border-color: var(--gold); background: linear-gradient(145deg, #1A1500, #0a0a0a); }
        @keyframes goldShine { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        .gold-shine { background: linear-gradient(90deg, #F5C518 0%, #FFF8DC 50%, #F5C518 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: goldShine 3s linear infinite; font-weight: 900; font-size: 24px; margin-bottom: 8px; }
        
        /* بطاقة السعر */
        .price-card { text-align: center; border-color: rgba(245, 197, 24, 0.4); background: linear-gradient(145deg, #1A1500, #0a0a0a); margin-bottom: 30px; }
        .price-title { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
        .price-value { font-size: 42px; font-weight: 900; color: #fff; margin-bottom: 8px; transition: color 0.2s ease, text-shadow 0.2s ease; }
        .price-change { display: inline-block; padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 900; background: rgba(0, 208, 132, 0.1); color: var(--green); }
        
        /* زر التحديث */
        .refresh-btn-wrapper { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px; padding-right: 5px; }
        .refresh-icon-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(245, 197, 24, 0.1); border: 1px solid rgba(245, 197, 24, 0.5); color: var(--gold); padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .refresh-icon-btn:active { background: var(--gold); color: #000; transform: scale(0.95); }
        .refresh-icon-btn svg { transition: transform 0.5s ease; }
        .refresh-icon-btn.spinning svg { transform: rotate(360deg); }

        /* الشارت */
        .chart-card { padding: 10px; background: #000; }
        .time-btns { display: flex; gap: 5px; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 10px; overflow-x: auto; }
        .time-btn { background: transparent; border: none; color: #848E9C; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .time-btn.active { background: #2B3139; color: var(--gold); }
        #chart-container { width: 100%; height: 350px; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-left">
            <a href="javascript:void(0)" onclick="history.back()" class="back-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <img src="https://i.postimg.cc/FKqk4pF6/file-00000000358081f69ff796420b71893d.png" class="header-logo" alt="Logo">
            <div class="header-title">
                <h1>Tradix Gold</h1>
                <span>XAU/USD PREMIUM</span>
            </div>
        </div>
        <div class="bell-icon">🔔</div>
    </div>

    <!-- المحتوى -->
    <div class="container">
        <!-- رسالة الترحيب -->
        <div class="card welcome-card">
            <h2 class="gold-shine">Welcome to Tradix Gold</h2>
            <p style="color: #AAAAAA; font-size: 13px;">Your premium gateway to live markets.</p>
        </div>

        <!-- بطاقة السعر -->
        <div class="card price-card">
            <div class="price-title">LIVE GOLD PRICE (XAU/USD)</div>
            <div id="liveGoldPrice" class="price-value">$0.00</div>
            <div id="liveGoldChange" class="price-change">+0.00%</div>
        </div>

        <!-- زر التحديث (فوق الشارت) -->
        <div class="refresh-btn-wrapper">
            <button class="refresh-icon-btn" onclick="refreshAll()" id="refreshBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Refresh
            </button>
        </div>

        <!-- الشارت -->
        <div class="card chart-card">
            <div class="time-btns">
                <button class="time-btn active" onclick="changeChart('1', this)">1m</button>
                <button class="time-btn" onclick="changeChart('5', this)">5m</button>
                <button class="time-btn" onclick="changeChart('15', this)">15m</button>
                <button class="time-btn" onclick="changeChart('60', this)">1H</button>
                <button class="time-btn" onclick="changeChart('240', this)">4H</button>
                <button class="time-btn" onclick="changeChart('W', this)">1W</button>
            </div>
            <div id="chart-container"></div>
        </div>
    </div>

    <!-- المحرك (JavaScript) -->
    <script>
        let previousPrice = 0;
        let currentInterval = '1';

        // 1. جلب السعر
        async function fetchPrice() {
            let currentPrice = 0;
            let change = 0;

            // محاولة جلب السعر من metals.live
            try {
                const res = await fetch('https://api.metals.live/v1/spot');
                const data = await res.json();
                if (data && Array.isArray(data)) {
                    for (let item of data) {
                        if (item.gold) {
                            currentPrice = parseFloat(item.gold);
                            break;
                        }
                    }
                }
            } catch (e) { console.log('metals.live failed'); }

            // إذا فشل، نجلب من gold-api
            if (!currentPrice || isNaN(currentPrice)) {
                try {
                    const res = await fetch('https://api.gold-api.com/price/XAU');
                    const data = await res.json();
                    if (data && data.price) currentPrice = parseFloat(data.price);
                } catch (e) { console.log('gold-api fallback failed'); }
            }

            // جلب نسبة التغيير
            try {
                const res2 = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=PAXGUSDT');
                const data2 = await res2.json();
                if (data2 && data2.priceChangePercent) change = parseFloat(data2.priceChangePercent);
            } catch(e) {}

            // تحديث السعر وتلوينه
            if (currentPrice > 0) {
                const priceEl = document.getElementById('liveGoldPrice');
                priceEl.textContent = '$' + currentPrice.toFixed(2);

                // إذا كان هناك سعر سابق، نقارنه لتلوين السعر
                if (previousPrice !== 0) {
                    if (currentPrice > previousPrice) { 
                        // صعود: لون أخضر وإضاءة
                        priceEl.style.color = '#00D084';
                        priceEl.style.textShadow = '0 0 15px #00D084';
                    } else if (currentPrice < previousPrice) { 
                        // نزول: لون أحمر وإضاءة
                        priceEl.style.color = '#FF4757';
                        priceEl.style.textShadow = '0 0 15px #FF4757';
                    }
                    
                    // إعادة اللون للأبيض بعد 2 ثانية
                    setTimeout(() => {
                        priceEl.style.color = '#ffffff';
                        priceEl.style.textShadow = 'none';
                    }, 2000);
                }
                // تحديث السعر السابق
                previousPrice = currentPrice;
            }

            // تحديث نسبة التغيير
            if (change !== 0) {
                const changeEl = document.getElementById('liveGoldChange');
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                if (change >= 0) {
                    changeEl.style.background = 'rgba(0, 208, 132, 0.1)';
                    changeEl.style.color = '#00D084';
                } else {
                    changeEl.style.background = 'rgba(255, 71, 87, 0.1)';
                    changeEl.style.color = '#FF4757';
                }
            }
        }

        // 2. تحميل الشارت
        function loadChart(interval) {
            const container = document.getElementById('chart-container');
            container.innerHTML = `<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=${interval}&hidesidetoolbar=1&symboledit=0&saveimage=0&theme=dark&style=1&timezone=Etc/UTC&locale=en" style="width:100%;height:100%;border:none;"></iframe>`;
        }

        // 3. تغيير الفريم
        function changeChart(interval, btn) {
            currentInterval = interval;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadChart(interval);
        }

        // 4. دالة التحديث اليدوي
        function refreshAll() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 500);
            
            fetchPrice();
            loadChart(currentInterval);
        }

        // التشغيل التلقائي
        fetchPrice();
        setInterval(fetchPrice, 3000); 
        loadChart('1'); 
    </script>
</body>
</html>
